spring.application.name=backend

# Base de datos (la de compose.yaml). Se pueden sobrescribir con variables de entorno,
# p. ej. SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/pena
spring.datasource.username=pena
spring.datasource.password=pena

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo comprueba que las entidades coinciden con las tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
